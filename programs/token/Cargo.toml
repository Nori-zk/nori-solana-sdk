[package]
name = "token"
version = "0.1.0"
description = "Nori Solana bridge program: verifies SP1 Helios proofs of Ethereum finalized state"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "token"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
alloy-primitives = { workspace = true, features = ["borsh"] }
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
# Force the "custom" backend onto the transitive getrandom 0.2 build
# (rand_core via k256/bls12_381); without a backend cfg the SBF target
# fails to compile it. Nothing in the program calls getrandom on-chain.
getrandom = { version = "0.2", features = ["custom"] }
solana-sha256-hasher = "3.1.0"
sp1-solana = { workspace = true }
nori-sp1-helios-primitives = { workspace = true }
nori-elf = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
solana-rpc-client = { workspace = true }
solana-message = { workspace = true }
solana-transaction = { workspace = true }
solana-signer = { workspace = true }
solana-keypair = { workspace = true }
test-utils = { workspace = true }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
