[package]
name = "nori-hash-utils"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "nori_hash_utils"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

# Standalone: kept out of the SDK's Cargo workspace so its lock (alloy pinned
# for the SBF toolchain) and the bridge-head guest's lock stay untouched.
[workspace]

[dependencies]
nori-hash = { git = "https://github.com/Nori-zk/nori-bridge-head", branch = "FEAT/solana-bridge" }
alloy-primitives = "1.3.0"
serde = { version = "1.0", features = ["derive"] }

# WebAssembly-specific output (for wasm-pack), as in proof-conversion's pairing-utils
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.4", optional = true }
tsify = { version = "0.5", optional = true }

[features]
wasm = ["wasm-bindgen", "serde-wasm-bindgen", "tsify"]
